namespaces:
  - 'rob1'
  - 'rob2'
  - 'rob3'

retract_height: 0.050
collision_gap_threshold: 0.003

rob1:
  base_frame: rob1_base
  eef_frame: rob1_typhoon_extruder_tcp
  task_frame: positioner

  velocity: 0.300
  travel_velocity: 0.400

  eef_rotation: [0.0, 0.0, 1.0, 0.0] # w, x, y, z
  home_position: [0.0, deg(21), deg(45), 0.0, deg(-66), 0.0]

  capabilities:
    - 0

  collision:
    width: 0.20
    length: 0.3
    height: 2.0

